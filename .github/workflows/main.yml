name: Build Hamrah Project APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build optimized installable APK
        run: gradle assembleRelease

      - name: Verify APK signature and package metadata
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | head -n 8
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload optimized APK
        uses: actions/upload-artifact@v4
        with:
          name: Hamrah-Project-APK-v0.4-optimized
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
